syntax = "proto3";

option java_package = "online.eracodes.protobuf.error";
option java_outer_classname = "ErrorProto";

message ErrorResponse {
  string error_id = 1;
  int32 error_code = 2;
  string message = 3;
  string details = 4;
  int64 timestamp = 5;
  string path = 6;
}

enum ErrorCode {
  UNKNOWN_ERROR = 0;
  INVALID_REQUEST = 1;
  VALIDATION_ERROR = 2;
  AUTHENTICATION_FAILED = 3;
  AUTHORIZATION_FAILED = 4;
  REGISTRATION_CODE_INVALID = 5;
  REGISTRATION_CODE_EXPIRED = 6;
  USER_NOT_FOUND = 7;
  DUPLICATE_EMAIL = 8;
  CRYPTOGRAPHIC_ERROR = 9;
  DATABASE_ERROR = 10;
  INTERNAL_SERVER_ERROR = 11;
}