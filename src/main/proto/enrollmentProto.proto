syntax = "proto3";

option java_package = "online.eracodes.protobuf.enrollment";
option java_outer_classname = "EnrollmentProto";

package online.eracodes.enrollment;

message CreateUserRequest {
  string name = 1;
  string email = 2;
}

message CreateUserResponse {
  string registrationCode = 1;  // 20-char hex code with embedded checksum
  string userId = 2;            // Unique identifier for created user
  string message = 3;            // Success message
}

message RegisterUserRequest {
  string email = 1;
  string registrationCode = 2;  // 20-char hex code with embedded checksum
}

message RegisterUserResponse {
  string authToken = 1;
  string username = 2;
  string email = 3;
  string message = 4;            // Success message
}

message PublicKeyResponse {
  bytes dilithiumPublicKey = 1;  // Serialized Dilithium public key
  string keyAlgorithm = 2;        // "DILITHIUM2" or similar
  int64 keyGeneratedAt = 3;      // Timestamp when key was generated
}

// Signed response wrapper
message SignedResponse {
  bytes body = 1;                  // Serialized Protocol Buffer object of the actual response
  bytes signature = 2;             // Dilithium signature of the serialized body
}

message AdminLoginRequest {
  string username = 1;
  string password = 2;
}

message AdminLoginResponse {
  string adminToken = 1;
  string adminName = 2;
  bool success = 3;
}