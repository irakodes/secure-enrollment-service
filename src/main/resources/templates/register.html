<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-section { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 5px; }
        h2 { margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        .success { background-color: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .error { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .code { font-family: monospace; font-size: 14px; background: #f5f5f5; padding: 10px; border-radius: 4px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>User Registration</h1>

    <!-- Step 1: Admin Creates User -->
    <div class="form-section">
        <h2>Step 1: Create User (Admin)</h2>
        
        <div th:if="${createSuccess}" class="success">
            <strong>User Created!</strong>
            <p><strong>Registration Code:</strong></p>
            <div class="code" th:text="${registrationCode}"></div>
            <p><small>Share this code with the user</small></p>
        </div>
        
        <div th:if="${createError}" class="error">
            <strong>Error:</strong> <span th:text="${createError}"></span>
        </div>

        <form method="post" action="/create-user">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email1">Email:</label>
                <input type="email" id="email1" name="email" required>
            </div>
            <button type="submit">Create User</button>
        </form>
    </div>

    <!-- Step 2: User Registers -->
    <div class="form-section">
        <h2>Step 2: Register User</h2>
        
        <div th:if="${registerSuccess}" class="success">
            <strong>Registration Successful!</strong>
            <p><strong>Auth Token:</strong></p>
            <div class="code" th:text="${authToken}"></div>
            <p><strong>Username:</strong> <span th:text="${username}"></span></p>
        </div>
        
        <div th:if="${registerError}" class="error">
            <strong>Error:</strong> <span th:text="${registerError}"></span>
        </div>

        <form method="post" action="/register">
            <div class="form-group">
                <label for="email2">Email:</label>
                <input type="email" id="email2" name="email" required>
            </div>
            <div class="form-group">
                <label for="registrationCode">Registration Code:</label>
                <input type="text" id="registrationCode" name="registrationCode" required 
                       placeholder="Enter the 20-character registration code">
            </div>
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
