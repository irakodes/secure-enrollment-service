spring.application.name=Secure Enrollment Service
spring.application.version=0.0.3

# Server settings
server.port=8443
server.compression.enabled=true
server.compression.mime-types=application/octet-stream
server.compression.min-response-size=1024

# H2 Database URL
spring.datasource.url=jdbc:h2:file:./data/ses_db
# spring.datasource.url=jdbc:h2:mem:ses_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=runH2N0w

spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update